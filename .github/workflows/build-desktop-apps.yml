name: Build Desktop Apps

# Builds the standalone eyes-of-aziz-setup / eyes-of-aziz-bridge executables
# (see packaging/eyes_of_aziz.spec) for Windows and macOS. Pushing a
# v*.*.* tag also creates a GitHub Release with each platform's build
# attached as a downloadable .zip -- that's what the website should link to.
#
# Code signing runs only once its secrets are added to the repo, so builds
# work (unsigned) without them:
#   macOS:   MACOS_CERTIFICATE_P12 (base64 Developer ID Application .p12),
#            MACOS_CERTIFICATE_PASSWORD, MACOS_SIGNING_IDENTITY
#            ("Developer ID Application: Name (TEAMID)"), and for
#            notarization APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD
#            (an app-specific password).
#   Windows: WINDOWS_CERTIFICATE_PFX (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      # One platform failing shouldn't cancel the other mid-build -- with
      # the default fail-fast, an artifact-quota failure on macOS once
      # silently canceled an otherwise-fine Windows build in progress.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Build executables
        run: pyinstaller packaging/eyes_of_aziz.spec --distpath dist --noconfirm

      - name: Sign (macOS)
        if: matrix.platform == 'macos' && env.MACOS_CERTIFICATE_P12 != ''
        env:
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          for exe in dist/eyes-of-aziz-setup dist/eyes-of-aziz-bridge; do
            codesign --force --timestamp --options runtime \
              --entitlements packaging/entitlements.plist \
              --sign "$MACOS_SIGNING_IDENTITY" "$exe"
            codesign --verify --strict --verbose=2 "$exe"
          done

      # Bare executables can't be stapled; Gatekeeper looks the ticket up online.
      - name: Notarize (macOS)
        if: matrix.platform == 'macos' && env.MACOS_CERTIFICATE_P12 != '' && env.APPLE_ID != ''
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          (cd dist && zip "$RUNNER_TEMP/notarize.zip" eyes-of-aziz-setup eyes-of-aziz-bridge)
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait

      - name: Sign (Windows)
        if: matrix.platform == 'windows' && env.WINDOWS_CERTIFICATE_PFX != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          foreach ($exe in "dist\eyes-of-aziz-setup.exe", "dist\eyes-of-aziz-bridge.exe") {
            & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Remove-Item $pfx

      # Fails the build if the packaged bridge can't load its face model, or
      # (after signing) can't run.
      - name: Self-test the packaged bridge
        shell: bash
        run: ./dist/eyes-of-aziz-bridge --self-test

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: eyes-of-aziz-${{ matrix.platform }}
          path: |
            dist/eyes-of-aziz-setup*
            dist/eyes-of-aziz-bridge*
          retention-days: 90

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip each platform's build into one downloadable file
        run: |
          cd artifacts
          for dir in */; do
            platform="${dir%/}"
            (cd "$platform" && zip -r "../${platform}.zip" .)
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" artifacts/*.zip --generate-notes
