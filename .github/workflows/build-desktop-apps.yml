name: Build Desktop Apps

# Builds the standalone eyes-of-aziz-setup / eyes-of-aziz-bridge executables
# (see packaging/eyes_of_aziz.spec) for Windows and macOS. Pushing a
# v*.*.* tag also creates a GitHub Release with each platform's build
# attached as a downloadable .zip -- that's what the website should link to.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      # One platform failing shouldn't cancel the other mid-build -- with
      # the default fail-fast, an artifact-quota failure on macOS once
      # silently canceled an otherwise-fine Windows build in progress.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Build executables
        run: pyinstaller packaging/eyes_of_aziz.spec --distpath dist --noconfirm

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: eyes-of-aziz-${{ matrix.platform }}
          path: |
            dist/eyes-of-aziz-setup*
            dist/eyes-of-aziz-bridge*
          retention-days: 90

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip each platform's build into one downloadable file
        run: |
          cd artifacts
          for dir in */; do
            platform="${dir%/}"
            (cd "$platform" && zip -r "../${platform}.zip" .)
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" artifacts/*.zip --generate-notes
