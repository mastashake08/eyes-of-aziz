[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eyes-of-aziz"
version = "0.1.0"
description = "Reference bridge agent that pulls frames from an RTSP camera and forwards them to Project Aziz's Eyes Of Aziz camera network for missing-person face matching."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "opencv-python-headless>=4.9,<5",
    "requests>=2.31,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "requests-mock>=1.12,<2",
]

[project.scripts]
eyes-of-aziz-bridge = "eyes_of_aziz.__main__:main"

[tool.setuptools.packages.find]
include = ["eyes_of_aziz*"]
